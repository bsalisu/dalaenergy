async function dk(pass,salt){const m=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}

<label>Button shape</label><select data-b="design.radius" data-num="1">${[[6,'Square'],[12,'Rounded'],[99,'Pill (current)']].map(o=>`<option value="${o[0]}" ${+d.radius===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select></div>
<div class="card"><h2>Animations</h2><label>Seconds each slide stays</label><input type="number" min="2" max="30" ${bind('design.slideSeconds')} data-num="1" value="${esc(d.slideSeconds)}"><label><input type="checkbox" ${bind('design.noAnim')} ${d.noAnim?'checked':''}> Turn off animations and transitions</label></div>
<div class="card"><button class="btn d" data-a="resetdesign">Reset design to default</button></div>`)}
async function ensureText(){if(pageText)return;pageText={};for(const p of PAGES){try{const r=await fetch('../'+p+'.html',{cache:'no-store'});const doc=new DOMParser().parseFromString(await r.text(),'text/html');
pageMeta[p]={title:doc.title,description:(doc.querySelector('meta[name=description]')||{}).content||''};
doc.querySelectorAll('[data-k]').forEach(e=>{const k=e.getAttribute('data-k');if(pageText[k])return;const c=e.cloneNode(true);c.querySelectorAll('em').forEach(m=>m.replaceWith('*'+m.textContent+'*'));pageText[k]={t:c.textContent.trim(),p:p,long:c.textContent.length>80}})}catch(e){}}}
async function vContent(){put('<div class="card">Loading...</div>');await ensureText();const keys=Object.keys(pageText),ct=S.contact,so=S.social;
const groups={};keys.forEach(k=>{(groups[pageText[k].p]=groups[pageText[k].p]||[]).push(k)});
put(`<div class="card"><h2>Contact information</h2><div class="grid c2">${inp('contact.phone1','Phone / WhatsApp 1')}${inp('contact.phone2','Phone / WhatsApp 2')}${inp('contact.email','Email')}${inp('contact.address','Office address')}</div><p class="muted">Changes the number, email and address everywhere on the site, including the WhatsApp and call buttons.</p></div>
<div class="card"><h2>Social media links</h2><div class="grid c2">${['facebook','instagram','tiktok','x','youtube','linkedin'].map(k=>inp('social.'+k,k[0].toUpperCase()+k.slice(1)+' link','https://')).join('')}</div></div>
<div class="card"><h2>Website text</h2><p class="muted">Leave a box empty to keep the original text. In headlines, put *stars* around a word to colour it orange.</p>${Object.keys(groups).map(p=>`<details><summary>${PN[p]} page · ${groups[p].length} items</summary><div>${groups[p].map(k=>{const o=pageText[k],v=(S.text||{})[k];const val=v==null?'':v;return `<label>${esc(k)}</label>${o.long?`<textarea ${bind('text.@'+k)} placeholder="${esc(o.t)}">${esc(val)}</textarea>`:`<input type="text" ${bind('text.@'+k)} value="${esc(val)}" placeholder="${esc(o.t)}">`}`}).join('')}</div></details>`).join('')}</div>`)}
function vProducts(){const P=S.products;put(`<div class="card"><h2>Categories</h2>${P.categories.map((c,i)=>`<div class="row" style="margin-bottom:6px"><input type="text" style="flex:1" data-b="products.categories.${i}" data-cat="${i}" value="${esc(c)}"><button class="btn s d" data-a="delcat" data-i="${i}">Delete</button></div>`).join('')}<button class="btn s" data-a="addcat">Add category</button></div>
<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Products (${P.items.length})</h2><button class="btn p s" data-a="addprod">Add product</button></div><input type="text" id="q" placeholder="Search products" style="margin:10px 0" value=""><div id="plist">${P.items.map((x,i)=>prodHtml(x,i)).join('')}</div></div>`)}
function prodHtml(x,i){const P=S.products;return `<details data-name="${esc(x.name.toLowerCase())}"><summary><span>${esc(x.name)} <span class="muted">· ${esc(x.cat)}</span></span><span class="muted">${x.stock==='out'?'Out of stock':x.stock==='in'?'In stock':'Ask'}</span></summary><div>
${inp('products.items.'+i+'.name','Name')}${inp('products.items.'+i+'.brand','Brand (optional, customers can search it)')}${inp('products.items.'+i+'.keywords','Search keywords (optional)','e.g. outdoor, night vision')}<label>Category</label><select data-b="products.items.${i}.cat">${P.categories.map(c=>`<option ${c===x.cat?'selected':''}>${esc(c)}</option>`).join('')}</select>
<label>Description</label><textarea data-b="products.items.${i}.desc">${esc(x.desc)}</textarea>${inp('products.items.'+i+'.price','Price (numbers only, or text). Empty shows "Contact for Price"','e.g. 25000')}
<label>Stock</label><select data-b="products.items.${i}.stock">${[['ask','Ask for availability'],['in','In stock'],['out','Out of stock']].map(o=>`<option value="${o[0]}" ${x.stock===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>
<label>Photo</label><select data-b="products.items.${i}.image">${mediaOpts(x.image)}</select>
<div class="row" style="margin-top:12px"><button class="btn s" data-a="pup" data-i="${i}">Move up</button><button class="btn s" data-a="pdown" data-i="${i}">Move down</button><button class="btn s d" data-a="delprod" data-i="${i}">Delete product</button></div></div></details>`}
function vMedia(){put(`<div class="card"><h2>Upload images or videos</h2><p class="muted">Photos are resized to a maximum of 1920 pixels wide before upload so the site stays fast. Videos: MP4 or WebM, under 30 MB.</p><input type="file" id="up" accept="image/*,video/mp4,video/webm" multiple><div id="upst" class="muted"></div></div>
<div class="card"><h2>Your media (${media.length})</h2><div class="thumbs">${media.map((m,i)=>`<div class="th">${/\.(mp4|webm)$/i.test(m.name)?'<div class="v">Video</div>':`<div class="im" style="background-image:url('${esc(m.download_url)}')"></div>`}<div style="margin:6px 0"><b>${esc(m.path)}</b></div><div class="row"><label class="btn s" style="margin:0;display:inline-flex;align-items:center">Replace<input type="file" hidden data-rep="${i}" accept="image/*,video/mp4,video/webm"></label><button class="btn s d" data-a="delmedia" data-i="${i}">Delete</button></div></div>`).join('')||'<p class="muted">Nothing uploaded yet.</p>'}</div></div>`)}
function vSliders(){const pg=window._sp||'index';const L=S.slides[pg]||[];put(`<div class="card"><h2>Sliders</h2><label>Page</label><select id="sp">${PAGES.map(p=>`<option value="${p}" ${p===pg?'selected':''}>${PN[p]}</option>`).join('')}</select><p class="muted">Each slide changes automatically. Drag order with the arrows.</p>
${L.map((s,i)=>`<div class="card" style="padding:10px"><div class="row"><div class="th" style="width:90px;padding:4px">${/\.(mp4|webm)$/i.test(s.src)?'<div class="v">Video</div>':`<div class="im" style="height:56px;background-image:url('${esc(mediaUrl(s.src))}')"></div>`}</div><div style="flex:1;min-width:180px"><select data-b="slides.${pg}.${i}.src">${mediaOpts(s.src)}</select><input type="text" style="margin-top:6px" data-b="slides.${pg}.${i}.caption" value="${esc(s.caption)}" placeholder="Caption"></div></div>
<div class="row" style="margin-top:8px"><button class="btn s" data-a="sup" data-i="${i}">Up</button><button class="btn s" data-a="sdown" data-i="${i}">Down</button><button class="btn s d" data-a="sdel" data-i="${i}">Remove</button></div></div>`).join('')}<button class="btn p" data-a="sadd">Add slide</button></div>`)}
async function vSeo(){put('<div class="card">Loading...</div>');await ensureText();put(`<div class="card"><h2>Search engine titles and descriptions</h2><p class="muted">Leave empty to keep the original.</p>${PAGES.map(p=>`<details><summary>${PN[p]}</summary><div>${inp('seo.'+p+'.title','Page title',(pageMeta[p]||{}).title)}<label>Description</label><textarea data-b="seo.${p}.description" placeholder="${esc((pageMeta[p]||{}).description)}">${esc(get(S,'seo.'+p+'.description')||'')}</textarea></div></details>`).join('')}</div>`)}
function vHelp(){put(`<div class="card"><h2>Account and security</h2><p>Signed in to <b>${esc(cfg.repo)}</b> (${esc(cfg.branch)}). Only someone with your passcode on this device, and a GitHub token that can write to your repository, can publish changes.</p><div class="row"><button class="btn" data-a="lock">Lock now</button><button class="btn d" data-a="reset">Sign out and remove token</button></div></div>
<div class="card"><h2>Not yet in this dashboard</h2><p class="muted">Creating, deleting and duplicating whole pages, rearranging page sections, and a layout and spacing editor are not built yet. Everything else on the tabs above works.</p></div>`)}
/* ---------- actions ---------- */
async function doPublish(){if(busy)return;busy=true;try{const body='window.DALA_SITE = '+JSON.stringify(S,null,1)+';\n';const cur=await getF('site-data.js');
const r=await putF('site-data.js',btoa(unescape(encodeURIComponent(body))),'Dashboard: publish changes',cur?cur.sha:null);sha=r&&r.content?r.content.sha:sha;localStorage.removeItem('dala_draft');dirty=false;render();toast('Published. Your live website will update in about 1 to 2 minutes.',6000)}catch(e){toast('Could not publish: '+e.message,8000)}busy=false}
async function readImg(file){if(!file.type.startsWith('image/'))return file.arrayBuffer();const bm=await createImageBitmap(file);const sc=Math.min(1,1920/bm.width),c=document.createElement('canvas');c.width=Math.round(bm.width*sc);c.height=Math.round(bm.height*sc);c.getContext('2d').drawImage(bm,0,0,c.width,c.height);const png=file.type==='image/png';return new Promise(r=>c.toBlob(b=>b.arrayBuffer().then(r),png?'image/png':'image/jpeg',.88))}
const safe=n=>n.toLowerCase().replace(/\.jpeg$/,'.jpg').replace(/[^a-z0-9.]+/g,'-').replace(/^-+|-+$/g,'');
async function upload(files,replaceIdx){const st=$('#upst');for(const f of files){try{if(f.type.startsWith('video/')&&f.size>30*1024*1024){toast(f.name+' is over 30 MB.');continue}
let name=replaceIdx!=null?media[replaceIdx].name:safe(f.name);if(replaceIdx==null&&!/\.(jpg|png|webp|gif|mp4|webm)$/.test(name))name+=f.type==='image/png'?'.png':'.jpg';
const path='media/'+name,ex=media.find(m=>m.path===path),data=await readImg(f);if(st)st.textContent='Uploading '+name+'...';
await putF(path,b64(data),'Dashboard: upload '+name,ex?ex.sha:null)}catch(e){toast('Upload failed: '+e.message,8000)}}
await loadMedia();render();toast('Upload complete.')}
document.addEventListener('click',async e=>{const a=e.target.closest('[data-a]');if(!a)return;arm();const k=a.dataset.a,i=+a.dataset.i;
try{if(k==='tab'){tab=a.dataset.v;render()}
else if(k==='save'){localStorage.setItem('dala_draft',JSON.stringify(S));dirty=false;const c=$('#chip');if(c){c.textContent='Draft saved on this device';c.className='chip'}toast('Saved. Press Publish to put it on the live website.')}
else if(k==='publish')await doPublish();else if(k==='lock')lock();
else if(k==='reset'){if(confirm('Remove the saved token and setup from this device?')){localStorage.removeItem('dala_admin');localStorage.removeItem('dala_draft');cfg=null;S=null;renderLogin()}}
else if(k==='setup'){const repo=$('#repo').value.trim(),br=$('#br').value.trim()||'main',tk=$('#tk').value.trim(),p1=$('#pc').value,p2=$('#pc2').value;
if(!/^[\w.-]+\/[\w.-]+$/.test(repo))return toast('Repository must look like owner/name.');if(!tk)return toast('Paste your GitHub token.');if(p1.length<8)return toast('Passcode needs 8 or more characters.');if(p1!==p2)return toast('Passcodes do not match.');
a.disabled=true;try{await enter({repo,branch:br,token:tk});localStorage.setItem('dala_admin',JSON.stringify(await seal({repo,branch:br,token:tk},p1)))}catch(er){toast(er.message,7000);a.disabled=false}}
else if(k==='unlock'){const pc=$('#pc').value;let c;try{c=await unseal(JSON.parse(localStorage.getItem('dala_admin')),pc)}catch(er){const n=+(sessionStorage.getItem('dala_try')||0)+1;sessionStorage.setItem('dala_try',n);if(n>=5){a.disabled=true;setTimeout(()=>a.disabled=false,60000);return toast('Too many tries. Wait 1 minute.')}return toast('Wrong passcode.')}
sessionStorage.removeItem('dala_try');try{await enter(c)}catch(er){toast(er.message,7000)}}
else if(k==='resetdesign'){if(confirm('Reset all design settings?')){S.design=JSON.parse(JSON.stringify(SEED.design));mark();render()}}
else if(k==='addcat'){S.products.categories.push('New category');mark();render()}
else if(k==='delcat'){const c=S.products.categories[i];if(S.products.items.some(x=>x.cat===c))return toast('Move or delete the products in this category first.');S.products.categories.splice(i,1);mark();render()}
else if(k==='addprod'){S.products.items.unshift({id:'p'+Date.now(),name:'New product',cat:S.products.categories[0]||'',desc:'Available at our outlet. Prices and availability are confirmed on request.',price:'',stock:'ask',image:''});mark();render();document.querySelector('#plist details').open=true}
else if(k==='delprod'){if(confirm('Delete this product?')){S.products.items.splice(i,1);mark();render()}}
else if(k==='pup'||k==='pdown'){const L=S.products.items,j=k==='pup'?i-1:i+1;if(j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];mark();render()}}
else if(k==='delmedia'){const m=media[i];if(confirm('Delete '+m.name+' from your website files?')){await delF(m.path,m.sha,'Dashboard: delete '+m.name);await loadMedia();render();toast('Deleted.')}}
else if(k==='sadd'){const pg=window._sp||'index';(S.slides[pg]=S.slides[pg]||[]).push({src:SITEPHOTOS[0],caption:''});mark();render()}
else if(k==='sdel'){S.slides[window._sp||'index'].splice(i,1);mark();render()}
else if(k==='sup'||k==='sdown'){const L=S.slides[window._sp||'index'],j=k==='sup'?i-1:i+1;if(j>=0&&j<L.length){[L[i],L[j]]=[L[j],L[i]];mark();render()}}
}catch(er){toast(er.message,7000)}});
document.addEventListener('input',e=>{const t=e.target;arm();if(t.id==='q'){const v=t.value.toLowerCase();document.querySelectorAll('#plist details').forEach(d=>d.hidden=!d.dataset.name.includes(v));return}
if(!t.dataset.b||!S)return;let p=t.dataset.b,v=t.type==='checkbox'?t.checked:t.value;if(t.dataset.num)v=+v;
if(p==='design.@font'){const [f,g]=v.split('|');S.design.font=f||'';S.design.gf=g||'';}
else if(p.startsWith('text.@')){const key=p.slice(6);S.text=S.text||{};if(v==='')delete S.text[key];else S.text[key]=v}
else{set(S,p,v);if(p.startsWith('products.items.')&&p.endsWith('.name')){const s=t.closest('details').querySelector('summary span');s.firstChild.textContent=v+' '}}
mark();if(p.startsWith('design.')&&p!=='design.@font'){const sw=document.querySelector('.sw');if(sw)sw.innerHTML=['navy','deep','green','orange','blue'].map(c=>`<i style="background:${esc(S.design[c])}"></i>`).join('')}});
document.addEventListener('change',async e=>{const t=e.target;if(t.id==='up'&&t.files.length)await upload([...t.files]);else if(t.dataset.rep!=null&&t.files.length)await upload([t.files[0]],+t.dataset.rep);else if(t.id==='sp'){window._sp=t.value;render()}
else if(t.dataset.cat!=null){/* rename category: move its products */}});
document.addEventListener('focusin',e=>{const t=e.target;if(t.dataset&&t.dataset.cat!=null)t._old=t.value});
document.addEventListener('focusout',e=>{const t=e.target;if(t.dataset&&t.dataset.cat!=null&&t._old!==undefined&&t._old!==t.value){S.products.items.forEach(x=>{if(x.cat===t._old)x.cat=t.value});t._old=t.value;mark()}});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
renderLogin();
</script></body></html>
